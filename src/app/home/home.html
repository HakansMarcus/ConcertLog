<div class="page-header">
  <span class="hero-label">LIVE MUSIC ARCHIVE</span>

  <h1>Your Concert Archive</h1>

  <p>
    <strong>{{ totalConcerts() }}</strong> shows. Countless memories.
  </p>
</div>

<div class="search-bar">
  <app-searchbar (search)="updateSearch($event)"></app-searchbar>

  <button mat-icon-button (click)="openModal()">
    <mat-icon>add_circle</mat-icon>
  </button>
  <button mat-icon-button (click)="sortBandsByDate()">
    <mat-icon>sort</mat-icon>
  </button>
  <button mat-icon-button (click)="setGridView()">
    <mat-icon>grid_on</mat-icon>
  </button>
  <button mat-icon-button (click)="setListView()">
    <mat-icon>list</mat-icon>
  </button>
</div>

<div class="grid" [class.grid-view]="viewMode() === 'grid'">
  @for (band of filteredBands(); track band.id) {
    <app-card [band]="band"></app-card>
  } @empty {
    <div class="empty-state">
      <p>No concerts logged yet.</p>
      <small>Add your first band to start building your archive.</small>
    </div>
  }
</div>
